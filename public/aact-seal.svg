<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="شعار الأكاديمية الأمريكية للاستشارات والتدريب">
  <defs>
    <clipPath id="sealClip">
      <circle cx="256" cy="256" r="252" />
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <g clip-path="url(#sealClip)" filter="url(#softShadow)">
    <image href="/icon-512.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">خريجة تحمل شهادة الأكاديمية الأمريكية</title>
  <desc id="desc">صورة توضيحية محلية لخريجة بزي التخرج تحمل ملفاً بشعار أكاديمي.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b33"/>
      <stop offset="0.56" stop-color="#273452"/>
      <stop offset="1" stop-color="#741537"/>
    </linearGradient>
    <radialGradient id="halo" cx="55%" cy="22%" r="72%">
      <stop offset="0" stop-color="#d2ad5a" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243658"/>
      <stop offset="1" stop-color="#071123"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253a61"/>
      <stop offset="1" stop-color="#0b1429"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="23" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <rect width="900" height="900" fill="url(#halo)"/>
  <g opacity=".24">
    <circle cx="745" cy="125" r="155" fill="#bf1646" filter="url(#soft)"/>
    <circle cx="135" cy="775" r="175" fill="#d2ad5a" filter="url(#soft)"/>
    <path d="M0 780 C175 650 310 755 470 620 S710 460 900 520 V900 H0Z" fill="#0a1226"/>
    <rect x="82" y="78" width="736" height="724" rx="62" fill="none" stroke="#d2ad5a" stroke-opacity=".14" stroke-width="6"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(185 92)">
      <path d="M143 353 C50 462 15 612 0 795 H530 C515 612 480 462 387 353 Z" fill="url(#robe)"/>
      <path d="M140 795 C175 586 210 445 265 375 C321 448 354 588 392 795 Z" fill="#071123" opacity=".72"/>
      <path d="M200 402 L265 495 L330 402" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="265" cy="246" r="112" fill="#d3a17d"/>
      <path d="M136 228 C154 97 233 60 317 88 C398 115 425 184 395 282 C350 206 235 190 136 228 Z" fill="#281816"/>
      <path d="M131 166 L266 80 L447 165 L276 259 Z" fill="#0b1429"/>
      <path d="M266 80 L452 166 L266 197 L78 167 Z" fill="#182743" stroke="#d2ad5a" stroke-opacity=".55" stroke-width="5"/>
      <path d="M450 166 v105" stroke="#d2ad5a" stroke-width="7" stroke-linecap="round"/>
      <circle cx="450" cy="285" r="13" fill="#d2ad5a"/>
      <path d="M180 280 C212 337 323 337 355 280" fill="none" stroke="#8d1b32" stroke-opacity=".32" stroke-width="8" stroke-linecap="round"/>
      <rect x="305" y="540" width="158" height="222" rx="18" fill="url(#doc)" stroke="#d2ad5a" stroke-width="9" transform="rotate(-5 384 651)"/>
      <circle cx="383" cy="634" r="49" fill="#d2ad5a" opacity=".78"/>
      <path d="M356 635 l19 20 42-54" fill="none" stroke="#1d2947" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M55 650 C145 615 218 610 305 633" stroke="#d2a17d" stroke-width="44" stroke-linecap="round" opacity=".9"/>
      <path d="M453 658 C410 642 385 642 342 660" stroke="#bd8463" stroke-width="44" stroke-linecap="round" opacity=".92"/>
    </g>
  </g>

  <g opacity=".88">
    <rect x="245" y="825" width="410" height="6" rx="3" fill="#d2ad5a" opacity=".58"/>
    <text x="450" y="865" text-anchor="middle" fill="#ffffff" fill-opacity=".72" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="10">AMERICAN ACADEMY</text>
  </g>
</svg>

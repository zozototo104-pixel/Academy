      <path d="M252 92 v60" stroke="#d2ad5a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="252" cy="160" r="8" fill="#d2ad5a"/>
      <rect x="205" y="355" width="82" height="132" rx="8" fill="#efe2cc" transform="rotate(-8 246 421)"/>
      <path d="M222 378 h47 M218 407 h52 M216 437 h50" stroke="#bf1646" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- center graduate -->
    <g transform="translate(413 124)">
      <path d="M112 275 C26 362 0 512 0 760 H404 C393 512 365 362 280 275 Z" fill="url(#robe)"/>
      <path d="M95 760 C127 551 154 406 203 305 C254 408 282 553 314 760 Z" fill="#071123" opacity=".72"/>
      <path d="M158 323 L203 395 L249 323" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="203" cy="188" r="92" fill="#d2a17c"/>
      <path d="M98 175 C115 70 176 38 247 60 C321 82 341 130 325 210 C284 151 181 144 98 175 Z" fill="#281816"/>
      <path d="M95 121 L204 56 L346 118 L211 190 Z" fill="#0b1429"/>
      <path d="M204 56 L349 119 L205 141 L58 119 Z" fill="#182743" stroke="#d2ad5a" stroke-opacity=".55" stroke-width="4"/>
      <path d="M347 119 v86" stroke="#d2ad5a" stroke-width="6" stroke-linecap="round"/>
      <circle cx="347" cy="216" r="11" fill="#d2ad5a"/>
      <rect x="246" y="470" width="122" height="178" rx="16" fill="#17223e" stroke="#d2ad5a" stroke-width="8" transform="rotate(-4 307 559)"/>
      <circle cx="307" cy="542" r="38" fill="#d2ad5a" opacity=".75"/>
      <path d="M286 543 l14 15 31-39" fill="none" stroke="#1d2947" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- right graduate -->
    <g transform="translate(765 202)">
      <path d="M96 230 C26 320 0 448 0 650 H334 C323 448 297 320 225 230 Z" fill="url(#robe2)"/>
      <path d="M78 650 C111 477 135 352 167 268 C205 353 228 478 257 650 Z" fill="#081126" opacity=".66"/>
      <circle cx="167" cy="154" r="78" fill="#b97f5f"/>
      <path d="M92 139 C102 73 145 42 199 56 C256 71 279 111 264 175 C227 134 163 122 92 139 Z" fill="#191312"/>
      <path d="M71 103 L168 48 L288 101 L177 161 Z" fill="#0b1429"/>
      <path d="M168 48 L292 102 L169 121 L41 103 Z" fill="#192848" stroke="#d2ad5a" stroke-opacity=".45" stroke-width="3"/>
      <path d="M289 102 v70" stroke="#d2ad5a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="289" cy="181" r="9" fill="#d2ad5a"/>
      <rect x="44" y="390" width="92" height="150" rx="11" fill="#f1e7d2" transform="rotate(10 90 465)"/>
      <path d="M61 417 h50 M62 448 h52 M66 481 h44" stroke="#1d2947" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>

  <g opacity=".85">
    <rect x="382" y="786" width="436" height="6" rx="3" fill="#d2ad5a" opacity=".58"/>
    <text x="600" y="835" text-anchor="middle" fill="#ffffff" fill-opacity=".78" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="12">AMERICAN ACADEMY</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">طلاب وخريجون من الأكاديمية الأمريكية</title>
  <desc id="desc">لوحة بصرية محلية لخريجين بزي التخرج بألوان الأكاديمية الأمريكية.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a31"/>
      <stop offset="0.5" stop-color="#273452"/>
      <stop offset="1" stop-color="#671331"/>
    </linearGradient>
    <radialGradient id="light" cx="52%" cy="24%" r="58%">
      <stop offset="0" stop-color="#d2ad5a" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17223e"/>
      <stop offset="1" stop-color="#071123"/>
    </linearGradient>
    <linearGradient id="robe2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233458"/>
      <stop offset="1" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d51b52"/>
      <stop offset="1" stop-color="#8d1b32"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#light)"/>
  <g opacity=".24">
    <path d="M-50 810 C210 650 330 820 545 620 S930 430 1260 560 L1260 940 L-50 940 Z" fill="#0a1226"/>
    <path d="M94 102h1000v700H94z" rx="56" fill="none" stroke="#d2ad5a" stroke-opacity=".12" stroke-width="7"/>
    <circle cx="1020" cy="140" r="170" fill="#bf1646" opacity=".2" filter="url(#soft)"/>
    <circle cx="160" cy="745" r="180" fill="#d2ad5a" opacity=".14" filter="url(#soft)"/>
  </g>

  <g filter="url(#shadow)">
    <!-- left graduate -->
    <g transform="translate(172 213)">
      <path d="M105 215 C32 302 8 438 0 640 H310 C300 438 276 302 204 215 Z" fill="url(#robe2)"/>
      <path d="M74 642 C93 505 112 370 152 244 C195 372 214 506 236 642 Z" fill="#101a31" opacity=".65"/>
      <circle cx="154" cy="140" r="72" fill="#c99673"/>
      <path d="M83 135 C92 62 132 34 185 50 C230 64 245 96 235 157 C210 122 143 114 83 135 Z" fill="#2b1c19"/>
      <path d="M68 94 L154 45 L252 91 L166 140 Z" fill="#0b1429"/>

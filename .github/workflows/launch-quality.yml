name: Launch Quality Suite

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: true
        default: "https://academy-raqaba.vercel.app"
      run_voice_token:
        description: 'Create Gemini Live ephemeral token during voice readiness test'
        type: boolean
        required: false
        default: false
      require_voice_ready:
        description: 'Fail the workflow if Gemini Live voice readiness is not OK'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  launch-quality:
    name: Speed, AI, curriculum, thesis, and voice quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
      E2E_RUN_VOICE_TOKEN: ${{ inputs.run_voice_token && '1' || '0' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      - name: Verify required quality secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Wait for launch quality route
        shell: bash
        run: |
          set -euo pipefail
          base="${E2E_BASE_URL%/}"
          url="$base/api/admin/launch-quality"
          echo "Waiting for deployed route: $url"
          for i in {1..60}; do
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              code=$(curl -sS -o /tmp/quality-route-check.txt -w "%{http_code}" \
                -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                -H "x-vercel-set-bypass-cookie: true" \
                "$url" || true)
            else
              code=$(curl -sS -o /tmp/quality-route-check.txt -w "%{http_code}" "$url" || true)
            fi
            echo "Attempt $i: HTTP $code"
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "Launch quality route is deployed."
              exit 0
            fi
            sleep 10
          done
          echo "Launch quality route was not deployed after waiting. Last response:"
          cat /tmp/quality-route-check.txt || true
          exit 1

      - name: Run launch quality suite
        run: bun run e2e:quality

      - name: Upload launch quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-quality-report
          path: |
            test-results/launch-quality/**
            playwright-report/**
          if-no-files-found: warn

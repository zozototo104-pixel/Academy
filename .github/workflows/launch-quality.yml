name: Launch Quality Suite

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: true
        default: "https://academy-raqaba.vercel.app"
      run_voice_token:
        description: 'Create Gemini Live ephemeral token during voice readiness test'
        type: boolean
        required: false
        default: false
      require_voice_ready:
        description: 'Fail the workflow if Gemini Live voice readiness is not OK'
        type: boolean
        required: false
        default: false
      run_pages_smoke:
        description: 'Run full platform page crash crawler'
        type: boolean
        required: false
        default: true
      route_limit:
        description: 'Maximum number of UI routes to visit when page smoke is enabled'
        required: false
        default: '80'

permissions:
  contents: read

jobs:
  launch-quality:
    name: Speed, AI, curriculum, thesis, and voice quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-e2e

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || vars.QA_ALLOWED_BASE_URLS }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      E2E_RUN_VOICE_TOKEN: ${{ inputs.run_voice_token && '1' || '0' }}
      E2E_REQUIRE_VOICE_READY: ${{ inputs.require_voice_ready && '1' || '0' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      - name: Verify required quality secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate E2E base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${E2E_BASE_URL}"

      - name: Strict launch quality preflight
        shell: bash
        env:
          CHECK_LAUNCH_QUALITY: '1'
          E2E_PREFLIGHT_DIR: test-results/launch-quality/preflight
        run: bash scripts/e2e-strict-preflight.sh

      - name: Run launch quality suite
        run: bun run e2e:quality

      - name: Sanitize launch quality artifacts before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results playwright-report

      - name: Upload launch quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-quality-report
          path: |
            test-results/launch-quality/**
            playwright-report/**
          if-no-files-found: warn

  platform-pages-smoke:
    name: Full platform page crash crawler
    if: ${{ inputs.run_pages_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa-e2e

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || vars.QA_ALLOWED_BASE_URLS }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      ROUTE_SMOKE_LIMIT: ${{ inputs.route_limit }}
      E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Verify page smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate E2E base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${E2E_BASE_URL}"

      - name: Strict page smoke preflight
        shell: bash
        env:
          E2E_PREFLIGHT_DIR: test-results/platform-routes/preflight
        run: bash scripts/e2e-strict-preflight.sh

      - name: Run full platform page smoke crawler
        run: bun run e2e:routes

      - name: Sanitize page smoke artifacts before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results playwright-report

      - name: Upload compact page smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-pages-smoke-diagnostics
          path: |
            test-results/platform-routes/
          if-no-files-found: ignore
          retention-days: 14

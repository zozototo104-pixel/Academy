name: Import AACT project
on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
      - '.upload/aact-project-lite.tar.gz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract project
        run: |
          base64 -d .upload/aact-project-lite.tar.gz > /tmp/aact-project-lite.tar.gz
          tar -xzf /tmp/aact-project-lite.tar.gz
      - name: Commit project files
        run: |
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import AACT Platform v1.3"
          git push

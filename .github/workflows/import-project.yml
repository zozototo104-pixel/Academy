name: Import AACT project

on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
      - 'AACT-Platform-v1.3.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f AACT-Platform-v1.3.zip
          mkdir -p /tmp/aact-project
          unzip -q AACT-Platform-v1.3.zip -d /tmp/aact-project
          cp -a /tmp/aact-project/. .

      - name: Commit project files
        run: |
          rm -f AACT-Platform-v1.3.zip
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import AACT Platform v1.3"
          git push

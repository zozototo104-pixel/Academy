name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - run: bun run test:outline-units
      - run: bun run test:gemini-live-rotation
      - run: bunx tsc --noEmit

  backup-restore-postgres:
    name: Backup restore — isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore_test_only
          POSTGRES_DB: academy_restore_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d academy_restore_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://restore:restore_test_only@localhost:5432/academy_restore_smoke
      DIRECT_URL: postgresql://restore:restore_test_only@localhost:5432/academy_restore_smoke
      AACT_BACKUP_ENCRYPTION_KEY: academy-ci-restore-smoke-key-only-not-a-secret-2026
      AACT_RESTORE_CONFIRM: "YES"
      AACT_RESTORE_ISOLATED_TARGET: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      # This database exists only as a disposable GitHub Actions service.
      - run: bunx prisma db push
      - name: Build a full-schema encrypted fixture
        run: |
          node <<'NODE'
          const { Prisma } = require('@prisma/client')
          const { createHash, createCipheriv, randomBytes } = require('node:crypto')
          const { gzipSync } = require('node:zlib')
          const { writeFileSync } = require('node:fs')
          const names = Object.keys(Prisma.ModelName).filter((name) => name !== 'Session')
          const fixtureModels = ['Setting', 'User', 'Notification', 'Program', 'Book', 'ProgramAssignment', 'AssignmentSubmission', 'ProgramExam', 'ProgramExamAttempt', 'Payment']
          const counts = Object.fromEntries(names.map((name) => [name, fixtureModels.includes(name) ? 1 : 0]))
          const lines = [{
            type: 'meta', platform: 'AACT', format: 'aact-db-jsonl-v1',
            exportedAt: new Date().toISOString(), tables: names,
          }]
          for (const name of names) {
            lines.push({ type: 'table', name, delegate: name[0].toLowerCase() + name.slice(1), count: counts[name] })
            if (name === 'Setting') {
              lines.push({ type: 'row', table: name, data: { key: 'RESTORE_SMOKE', value: 'verified' } })
            }
            if (name === 'User') {
              lines.push({ type: 'row', table: name, data: {
                id: 'restore-ci-user', email: 'restore-ci@example.test',
                password: 'fixture-not-a-login', name: 'Restore CI',
              } })
            }
            if (name === 'Notification') {
              lines.push({ type: 'row', table: name, data: {
                id: 'restore-ci-notification', userId: 'restore-ci-user',
                type: 'GENERAL', title: 'Restore test', body: 'FK verified',
              } })
            }
          }
          lines.push({ type: 'summary', counts, errors: [] })
          const plain = Buffer.from(lines.map((line) => JSON.stringify(line)).join('\n') + '\n')
          const zipped = gzipSync(plain)
          const sha = (buffer) => createHash('sha256').update(buffer).digest('hex')
          const aad = { compressedSha256: sha(zipped), uncompressedSha256: sha(plain) }
          const iv = randomBytes(12)
          const key = createHash('sha256').update(process.env.AACT_BACKUP_ENCRYPTION_KEY).digest()
          const cipher = createCipheriv('aes-256-gcm', key, iv)
          cipher.setAAD(Buffer.from(JSON.stringify(aad)))
          const encrypted = Buffer.concat([cipher.update(zipped), cipher.final()])
          const header = {
            type: 'aact-encrypted-backup-v1', algorithm: 'AES-256-GCM',
            iv: iv.toString('base64'), authTag: cipher.getAuthTag().toString('base64'), aad,
          }
          writeFileSync('/tmp/academy-restore-smoke.enc',
            Buffer.concat([Buffer.from(JSON.stringify(header) + '\n'), encrypted]))
          NODE
      - name: Restore atomically and refuse nonempty target
        run: |
          bunx tsx scripts/backup-restore.ts --file /tmp/academy-restore-smoke.enc
          bunx tsx scripts/backup-restore.ts --file /tmp/academy-restore-smoke.enc --restore
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client')
          const db = new PrismaClient()
          Promise.all([
            db.setting.findUnique({ where: { key: 'RESTORE_SMOKE' } }),
            db.notification.findUnique({
              where: { id: 'restore-ci-notification' },
              include: { user: true },
            }),
          ])
            .then(([setting, notification]) => {
              if (setting?.value !== 'verified') throw new Error('RESTORED_SETTING_MISSING')
              if (notification?.user?.email !== 'restore-ci@example.test') {
                throw new Error('RESTORED_FOREIGN_KEY_RELATION_MISSING')
              }
              console.log('Verified restored PostgreSQL rows and User → Notification relation')
            })
            .finally(() => db.$disconnect())
            .catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
          if bunx tsx scripts/backup-restore.ts --file /tmp/academy-restore-smoke.enc --restore > /tmp/restore-second.log 2>&1; then
            echo "ERROR: restored into a nonempty target"
            exit 1
          fi
          grep -q "RESTORE_TARGET_NOT_EMPTY:Setting" /tmp/restore-second.log
      - name: Verify concurrent backup snapshot on disposable PostgreSQL
        env:
          AACT_ALLOW_LOCAL_UPLOADS: "true"
        run: bunx tsx scripts/test-backup-snapshot.ts


name: TypeScript Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ESLint warning baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Collect ESLint warning baseline
        id: eslint-baseline
        shell: bash
        run: |
          set +e
          bunx eslint . --format json --output-file eslint-report.json --max-warnings=999999
          status=$?
          set -e
          node <<'NODE'
          const fs = require('fs')
          const reportPath = 'eslint-report.json'
          const rows = fs.existsSync(reportPath) ? JSON.parse(fs.readFileSync(reportPath, 'utf8')) : []
          let warnings = 0
          let errors = 0
          const byRule = new Map()
          for (const file of rows) {
            warnings += file.warningCount || 0
            errors += file.errorCount || 0
            for (const msg of file.messages || []) {
              if (msg.severity !== 1) continue
              const rule = msg.ruleId || 'unknown'
              byRule.set(rule, (byRule.get(rule) || 0) + 1)
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `warnings=${warnings}\nerrors=${errors}\n`)
          const sorted = [...byRule.entries()].sort((a, b) => b[1] - a[1])
          const summary = [
            '## ESLint warning baseline',
            '',
            `Total warnings: **${warnings}**`,
            `Total errors: **${errors}**`,
            '',
            '| Rule | Warnings |',
            '| --- | ---: |',
            ...(sorted.length ? sorted.map(([rule, count]) => `| \`${rule}\` | ${count} |`) : ['| _none_ | 0 |']),
            '',
            'Use this table as the PR baseline, then reduce one rule at a time in follow-up cleanup PRs.',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`)
          NODE
          exit "$status"

      - name: Enforce current ESLint warning ceiling
        shell: bash
        run: bunx eslint . --max-warnings=175

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore

  typecheck:
    name: TypeScript full check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy values only for Prisma client generation/type checking. This workflow does not connect to production DB.
      DATABASE_URL: postgresql://user:password@localhost:5432/aact?schema=public
      DIRECT_URL: postgresql://user:password@localhost:5432/aact?schema=public
      SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/shadow?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-dummy-secret-change-in-production
      AACT_AUTO_SEED_ON_LOGIN: "0"
      AACT_ENABLE_DEMO_LOGIN: "0"
      AACT_RUN_SEED: "NO"
      AACT_BOOTSTRAP_DEFAULT_ADMIN: "0"
      AACT_CONFIRM_DATA_LOSS: "NO"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Ensure schema changes have committed migrations
        shell: bash
        run: |
          set -euo pipefail
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > prisma-migration-diff.sql
          if grep -vE '^[[:space:]]*(-- This is an empty migration\.|--|$)' prisma-migration-diff.sql | grep -q .; then
            echo "Prisma schema differs from committed migrations. Create and commit a migration for schema.prisma changes." >&2
            echo "Generated diff:" >&2
            cat prisma-migration-diff.sql >&2
            exit 1
          fi

      - name: Run TypeScript check
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Add TypeScript errors to job summary
        if: always()
        shell: bash
        run: |
          echo "## TypeScript Check Log" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the artifact named \`typescript-check-log\` for the full log." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          tail -n 220 typecheck.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No typecheck.log found" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-check-log
          path: typecheck.log
          if-no-files-found: ignore

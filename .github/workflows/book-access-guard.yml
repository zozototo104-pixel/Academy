name: Book Access Guard

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Approved QA preview URL to test'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: book-access-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book-access-guard:
    name: Verify book access authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-e2e
    env:
      E2E_BASE_URL: ${{ inputs.target_url }}
      ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate E2E base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${E2E_BASE_URL}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'

      - name: Install dependencies for diagnostic guard
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify required admin E2E secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run book access guard
        run: bun run e2e:books

      - name: Upload sanitized book access reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-access-guard-json-reports
          path: |
            test-results/book-access-guard/*.json
          if-no-files-found: ignore
          retention-days: 7

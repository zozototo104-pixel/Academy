name: Book Access Guard

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Allowed target URL: academy-raqaba.vercel.app or aactacademy.com only'
        required: false
        default: 'https://academy-raqaba.vercel.app'
        type: string

permissions:
  contents: read

concurrency:
  group: book-access-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book-access-guard:
    name: Verify book access authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.target_url }}
      ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.AACT_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.AACT_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate allowed target URL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.E2E_BASE_URL || ''
          let parsed
          try {
            parsed = new URL(raw.startsWith('http') ? raw : `https://${raw}`)
          } catch (error) {
            console.error(`Invalid target_url: ${raw}`)
            process.exit(1)
          }
          const allowedHosts = new Set(['academy-raqaba.vercel.app', 'aactacademy.com', 'www.aactacademy.com'])
          if (parsed.protocol !== 'https:' || !allowedHosts.has(parsed.hostname)) {
            console.error(`Refusing to send admin credentials to disallowed target: ${parsed.href}`)
            console.error(`Allowed hosts: ${Array.from(allowedHosts).join(', ')}`)
            process.exit(1)
          }
          console.log(`Validated E2E target: ${parsed.href}`)
          NODE

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify required admin E2E secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run book access guard
        run: bun run e2e:books

      - name: Upload sanitized book access reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-access-guard-json-reports
          path: |
            test-results/book-access-guard/*.json
          if-no-files-found: ignore
          retention-days: 7

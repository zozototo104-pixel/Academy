name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # CI build فقط: نولّد Prisma Client ونبني Next.js بدون db push أو seed.
      # النشر الفعلي على Vercel يستخدم متغيرات البيئة الحقيقية وقاعدة الإنتاج.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      NEXTAUTH_SECRET: ci-nextauth-secret-not-used-in-production
      AUTH_SECRET: ci-auth-secret-not-used-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with:
          bun-version: "1.4.3"

      # GitHub Release assets can temporarily return 5xx; npm is Bun's supported alternative.
      - name: Install Bun from npm if GitHub download fails
        if: steps.setup_bun.outcome == 'failure'
        run: npm install --global bun@1.4.3

      - name: Show Bun version
        run: |
          bun --version
          test "$(bun --version)" = "1.4.3"

      - name: Install dependencies
        run: bun install

      - name: Run quality checks
        run: bun run quality

      - name: Run lint
        run: bun run lint

      - name: Test representative file visibility and review boundaries
        run: bun run test:representatives

      - name: Test account revocation and Google OAuth session security
        run: bun run test:stage-b-sessions

      - name: Test stage C exam security invariants
        run: bun test tests/exams/stage-c-exams.test.ts

      - name: Build Next.js application
        run: bun run build

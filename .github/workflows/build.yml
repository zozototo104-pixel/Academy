name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # CI build فقط: نولّد Prisma Client ونبني Next.js بدون db push أو seed.
      # النشر الفعلي على Vercel يستخدم متغيرات البيئة الحقيقية وقاعدة الإنتاج.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      NEXTAUTH_SECRET: ci-nextauth-secret-not-used-in-production
      AUTH_SECRET: ci-auth-secret-not-used-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Show Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js application
        run: bunx next build

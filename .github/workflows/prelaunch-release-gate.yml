name: Prelaunch Release Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Approved QA Preview URL to validate before public launch gate"
        required: true
        default: ""
      route_limit:
        description: "Maximum number of UI routes to crawl"
        required: false
        default: "120"
      run_full_journey:
        description: "Run destructive-safe full student/admin/payment journey with cleanup"
        type: boolean
        required: false
        default: true
      run_launch_quality:
        description: "Run launch quality suite: AI, curriculum, thesis, voice readiness"
        type: boolean
        required: false
        default: true
      run_ux_mobile_perf:
        description: "Run UX, mobile, and performance guardrail suites"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: prelaunch-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-smoke:
    name: QA Preview health and public pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: qa-e2e

    env:
      BASE_URL: ${{ inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate QA preview smoke base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${BASE_URL}"

      - name: Check health, login, programs, and home pages
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          mkdir -p test-results/prelaunch/http

          header_args=()
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            header_args=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" -H "x-vercel-set-bypass-cookie: true")
          fi

          check_url() {
            local path="$1"
            local name="$2"
            local out="test-results/prelaunch/http/${name}.txt"
            local body="test-results/prelaunch/http/${name}.body"
            local status
            status=$(curl -sS -L --retry 2 --max-time 25 "${header_args[@]}" -o "$body" -w "%{http_code}" "$base$path" || true)
            {
              echo "url=$base$path"
              echo "status=$status"
              echo "body_start:"
              head -c 2000 "$body" || true
            } > "$out"
            if [ "$status" -lt 200 ] || [ "$status" -ge 500 ]; then
              echo "Prelaunch HTTP check failed for $path with status $status"
              cat "$out"
              exit 1
            fi
          }

          check_url "/api/health" "api-health"
          check_url "/" "home"
          check_url "/login" "login"
          check_url "/programs" "programs"

      - name: Sanitize production smoke diagnostics before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results/prelaunch/http

      - name: Upload production smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-production-smoke
          path: test-results/prelaunch/http/**
          if-no-files-found: warn
          retention-days: 14

  static-build:
    name: TypeScript, build and platform domain regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aact_ci?schema=public
      NEXTAUTH_SECRET: ci-nextauth-secret-not-used-in-production
      AUTH_SECRET: ci-auth-secret-not-used-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Remove legacy conflicting book route before Next.js route collection
        run: rm -rf 'src/app/api/books/[bookId]'

      - name: Run TypeScript check
        run: bun run typecheck

      - name: Build Next.js application
        run: bunx next build

      - name: Run complete academic lifecycle, unit exams, grading, retries, appeals and graduation regressions
        run: |
          set -euo pipefail
          for suite in \
            test:lifecycle-journey test:semester-journey test:semester-lifecycle \
            test:semester-readiness test:semester-decision test:semester-decision-ui \
            test:semester-raise test:semester-step5 test:progression-gates \
            test:assessment-attempt-policy test:attempt-grading-integrity \
            test:exam-grading-flow test:unit-exam-reverify-grounding \
            test:exam-threshold-freeze test:submission-windows \
            test:semester-approval test:semester-approval-failed-components \
            test:grade-approval test:grade-approval-concurrency \
            test:semester-grade test:final-grade-golden test:final-grade-cap \
            test:final-grade-approved-score test:contextual-finality \
            test:mercy-path test:mercy-progression test:mercy-ui \
            test:reopen-appeals test:reopen-grants test:rules-snapshot \
            test:graduation-approval test:certificate-disclosure \
            test:student-standing test:student-tracking; do
            echo "::group::${suite}"
            bun run "$suite"
            echo "::endgroup::"
          done

      - name: Run AI answers, grounding, student context, grading and agent regression suites
        run: |
          set -euo pipefail
          for suite in \
            test:ai-ui-wiring test:academic-ai-router test:student-ai-access \
            test:ai-d1 test:ai-d2 test:ai-stage-profiles test:ai-stage-reading \
            test:ai-router-restriction test:ai-stage-analysis \
            test:ai-stage-generation test:ai-stage-review \
            test:ai-recheck-queue test:ai-recheck-runner test:ai-recheck-admin \
            test:ai-question-length test:ai-stage-profiles-admin \
            test:ai-advisor-readiness test:supervisor-assignment-grading \
            test:supervisor-performance-context test:supervisor-scope \
            test:whatsapp-ai-only test:live-token-supervisor-gate; do
            echo "::group::${suite}"
            bun run "$suite"
            echo "::endgroup::"
          done

      - name: Require scholarship implementation before certifying full platform QA
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            tests/payments/scholarship-waitlist.test.ts \
            scripts/test-grants-pg-concurrency.ts \
            src/lib/scholarship-waitlist.ts \
            prisma/migrations/20261109120000_scholarship_organization/migration.sql; do
            if [ ! -f "$required" ]; then
              echo "::error::Scholarship QA prerequisite missing: $required. Integrate PR #191 before running the unified release gate."
              exit 1
            fi
          done
          bun run test:grants-pg-concurrency

      - name: Run finance, scholarships, supervisor and meeting regression tests
        run: |
          bun run test:payments
          bun run test:waiver-code-filters
          bun run test:waiver-code-resend
          bun run test:supervisor-assignment-grading
          bun run test:supervisor-scope
          bun run test:meetings

      - name: Run notification and student dashboard regression tests
        run: |
          bun run test:notifications
          bun run test:student-preview
          bun run test:students-list-filters
          bun run test:student-dashboard-organization

  critical-e2e:
    name: Admin, routes, books, payments, certificates, and full journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - production-smoke
      - static-build
    environment: qa-e2e

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.QA_DATABASE_URL }}
      ROUTE_SMOKE_LIMIT: ${{ inputs.route_limit || '120' }}
      E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: "1"
      E2E_ENFORCE_COMMIT_MATCH: "1"
      E2E_WAIT_FOR_DEPLOYMENT: "1"
      E2E_DEPLOY_WAIT_SECONDS: "420"
      E2E_DEPLOY_WAIT_INTERVAL_SECONDS: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client for E2E database fixtures
        run: bunx prisma generate

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Verify required admin E2E secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate critical QA E2E base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${E2E_BASE_URL}"

      - name: Strict E2E preflight
        shell: bash
        env:
          E2E_PREFLIGHT_DIR: test-results/prelaunch/preflight
        run: bash scripts/e2e-strict-preflight.sh

      - name: Run admin launch smoke test
        run: bun run e2e:admin

      - name: Run manual payment guardrails
        run: |
          bun run db:generate
          bunx playwright test --config=playwright.config.ts tests/e2e/manual-payment-guard.spec.ts

      - name: Run book access guardrails
        run: bun run e2e:books

      - name: Run full platform journey
        if: ${{ github.event_name == 'push' || inputs.run_full_journey }}
        run: bun run e2e:journey

      - name: Run full platform route crawler
        run: bun run e2e:routes

      - name: Verify public SEO discovery endpoints on QA Preview
        shell: bash
        run: |
          set -euo pipefail
          base="${E2E_BASE_URL%/}"
          headers=()
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          mkdir -p test-results/prelaunch/seo
          for endpoint in robots.txt sitemap.xml; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              "${headers[@]}" "$base/$endpoint" \
              -o "test-results/prelaunch/seo/${endpoint}.txt"
            test -s "test-results/prelaunch/seo/${endpoint}.txt"
          done
          grep -qi 'sitemap' test-results/prelaunch/seo/robots.txt
          grep -qi '<urlset\|<sitemapindex' test-results/prelaunch/seo/sitemap.xml

      - name: Sanitize critical E2E diagnostics before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results playwright-report

      - name: Upload critical E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-critical-e2e
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  experience-guardrails:
    name: Launch quality, UX, mobile, and performance guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - critical-e2e
    if: ${{ github.event_name == 'push' || inputs.run_launch_quality || inputs.run_ux_mobile_perf }}
    environment: qa-e2e

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.QA_DATABASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      E2E_RUN_VOICE_TOKEN: "0"
      E2E_REQUIRE_VOICE_READY: "0"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.QA_VERCEL_BYPASS }}
      E2E_ALLOWED_BASE_URLS: ${{ vars.QA_ALLOWED_BASE_URLS }}
      E2E_QA_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Validate experience QA guardrail base URL allowlist
        run: bash scripts/validate-e2e-base-url.sh "${E2E_BASE_URL}"

      - name: Run launch quality suite
        if: ${{ github.event_name == 'push' || inputs.run_launch_quality }}
        run: bun run e2e:quality

      - name: Sanitize launch quality diagnostics before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results/launch-quality playwright-report

      - name: Upload launch quality diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-launch-quality
          path: |
            test-results/launch-quality/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run UX guardrails
        if: ${{ github.event_name == 'push' || inputs.run_ux_mobile_perf }}
        run: bun run e2e:ux

      - name: Run mobile UX guardrails
        if: ${{ github.event_name == 'push' || inputs.run_ux_mobile_perf }}
        run: bun run e2e:mobile

      - name: Run performance guardrails
        if: ${{ github.event_name == 'push' || inputs.run_ux_mobile_perf }}
        run: bun run e2e:perf

      - name: Sanitize experience guardrail diagnostics before upload
        if: always()
        run: bash scripts/sanitize-e2e-artifacts.sh test-results playwright-report

      - name: Upload experience guardrail diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-experience-guardrails
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  cleanup-qa-fixtures:
    name: Cleanup QA workflow fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - critical-e2e
      - experience-guardrails
    if: ${{ always() }}
    environment: qa-e2e

    env:
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.QA_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Verify database cleanup secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing required secret: DATABASE_URL"
            exit 1
          fi

      - name: Dry-run QA cleanup report
        run: bun run data:cleanup:qa:dry-run

      - name: Execute QA-only cleanup
        env:
          AACT_CONFIRM_QA_ONLY_CLEANUP: DELETE_QA_ONLY
        run: bun run data:cleanup:qa

  unified-report:
    name: Unified QA Preview PASS/FAIL report
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - production-smoke
      - static-build
      - critical-e2e
      - experience-guardrails
      - cleanup-qa-fixtures
    steps:
      - name: Publish single release gate verdict
        env:
          SMOKE: ${{ needs.production-smoke.result }}
          STATIC: ${{ needs.static-build.result }}
          CRITICAL: ${{ needs.critical-e2e.result }}
          EXPERIENCE: ${{ needs.experience-guardrails.result }}
          CLEANUP: ${{ needs.cleanup-qa-fixtures.result }}
        shell: bash
        run: |
          set -euo pipefail
          verdict=PASS
          {
            echo '## QA Preview — unified release gate'
            echo ''
            echo '| Phase | Result |'
            echo '|---|---|'
            for entry in "Public smoke:$SMOKE" "Build and domain regressions:$STATIC" "Critical E2E:$CRITICAL" "UX, mobile, quality and performance:$EXPERIENCE" "QA fixture cleanup:$CLEANUP"; do
              phase="${entry%%:*}"
              result="${entry#*:}"
              echo "| $phase | $result |"
              if [ "$result" != success ]; then verdict=FAIL; fi
            done
            echo ''
            echo "**Final verdict: $verdict**"
            echo ''
            echo 'A PASS covers only the suites listed above; unimplemented feature scenarios are not certified.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != PASS ]; then
            echo '::error::QA Preview release gate failed or skipped one or more required phases'
            exit 1
          fi

name: Restore AdminExtras and add invoice refresh button safely

on:
  push:
    branches:
      - program-rules-canonical-editor
    paths:
      - .github/workflows/restore-and-add-invoice-refresh.yml

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          ref: program-rules-canonical-editor
          fetch-depth: 0

      - name: Restore exact long AdminExtras and add invoice refresh UI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout e6fa54372aac059e3ada0e4bb6beda85d9eb6c1a -- src/components/aact/AdminExtras.tsx
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/aact/AdminExtras.tsx')
          text = path.read_text()

          state_old = "  const [pdfBusy, setPdfBusy] = useState<string | null>(null)\n\n  const load = () => setPaymentRefresh((v) => v + 1)\n"
          state_new = "  const [pdfBusy, setPdfBusy] = useState<string | null>(null)\n  const [amountBusy, setAmountBusy] = useState<string | null>(null)\n\n  const load = () => setPaymentRefresh((v) => v + 1)\n"
          if state_new not in text:
            if state_old not in text:
              raise SystemExit('state insertion marker not found')
            text = text.replace(state_old, state_new, 1)

          if 'const refreshPaymentAmount = async (payment: PaymentRow)' not in text:
            needle = "  const openInvoicePdf = async (id: string) => {"
            start = text.index(needle)
            loading_marker = "\n  if (loading) return <div className=\"flex h-40 items-center justify-center\"><Loader2 className=\"h-8 w-8 animate-spin text-[#c9a227]\" /></div>\n"
            insert_at = text.index(loading_marker, start)
            handler = """

  const refreshPaymentAmount = async (payment: PaymentRow) => {
    setAmountBusy(payment.id)
    try {
      const preview = await api<{ changed: boolean; oldAmount: number; newAmount: number; source?: string }>('/api/admin/payments', {
        method: 'PATCH',
        body: JSON.stringify({ id: payment.id, action: 'REFRESH_AMOUNT', dryRun: true }),
      })
      if (!preview.changed) {
        toast({ title: 'لا يوجد تغيير', description: 'المبلغ الحالي مطابق للمبلغ المحسوب من الإعدادات الحالية.' })
        return
      }
      const confirmed = window.confirm(`سيتم تحديث مبلغ الفاتورة غير المدفوعة من ${preview.oldAmount}$ إلى ${preview.newAmount}$. هل تريد المتابعة؟`)
      if (!confirmed) return
      const reason = window.prompt('اكتب سبب تحديث مبلغ الفاتورة ليظهر في سجل التدقيق:')
      if (reason === null) return
      const trimmedReason = reason.trim()
      if (trimmedReason.length < 6) {
        toast({ title: 'سبب مطلوب', description: 'اكتب سبباً واضحاً لا يقل عن 6 أحرف.', variant: 'destructive' })
        return
      }
      await api('/api/admin/payments', {
        method: 'PATCH',
        body: JSON.stringify({ id: payment.id, action: 'REFRESH_AMOUNT', reason: trimmedReason }),
      })
      toast({ title: 'تم تحديث المبلغ', description: `تم تحديث الفاتورة من ${preview.oldAmount}$ إلى ${preview.newAmount}$` })
      load()
    } catch (e: any) {
      toast({ title: 'تعذر تحديث المبلغ', description: e.message, variant: 'destructive' })
    } finally {
      setAmountBusy(null)
    }
  }
"""
            text = text[:insert_at] + handler + text[insert_at:]

          header_old = "                    <th className=\"p-3 font-black\">الحالة</th>\n                    <th className=\"p-3 font-black\">PDF</th>\n                    <th className=\"p-3 font-black\">تأكيد يدوي</th>\n                  </tr>\n"
          header_new = "                    <th className=\"p-3 font-black\">الحالة</th>\n                    <th className=\"p-3 font-black\">PDF</th>\n                    <th className=\"p-3 font-black\">تحديث المبلغ</th>\n                    <th className=\"p-3 font-black\">تأكيد يدوي</th>\n                  </tr>\n"
          if header_new not in text:
            if header_old not in text:
              raise SystemExit('header marker not found')
            text = text.replace(header_old, header_new, 1)

          confirm_old = """                      <td className=\"p-3\">
                        {p.status === 'UNPAID' ? (
                          <Button size=\"sm\" variant=\"outline\" onClick={() => confirm(p)}
                            className=\"border-emerald-200 font-bold text-emerald-600\">
                            <Banknote className=\"ml-1 h-3 w-3\" /> {p.purpose === 'AI_LIVE_CREDIT' ? 'تأكيد وصول مبلغ باقة الصوت' : 'تأكيد وصول المبلغ'}
                          </Button>
                        ) : '—'}
                      </td>
"""
          refresh_cell = """                      <td className=\"p-3\">
                        {p.status === 'UNPAID' ? (
                          <Button size=\"sm\" variant=\"outline\" disabled={amountBusy === p.id} onClick={() => refreshPaymentAmount(p)}
                            className=\"border-[#c9a227]/40 font-bold text-[#a8841a]\">
                            {amountBusy === p.id ? <Loader2 className=\"ml-1 h-3 w-3 animate-spin\" /> : <RefreshCw className=\"ml-1 h-3 w-3\" />} تحديث المبلغ
                          </Button>
                        ) : '—'}
                      </td>
"""
          if refresh_cell not in text:
            if confirm_old not in text:
              raise SystemExit('confirm cell marker not found')
            text = text.replace(confirm_old, refresh_cell + confirm_old, 1)

          if text.count("'use client'") != 1:
            raise SystemExit(f"unexpected use client count: {text.count(chr(39)+'use client'+chr(39))}")
          if text.count('const refreshPaymentAmount = async') != 1:
            raise SystemExit('refresh handler count is not 1')
          if text.count('تحديث المبلغ') < 3:
            raise SystemExit('refresh button/header text missing')

          path.write_text(text)
          PY
          rm -f .github/workflows/restore-and-add-invoice-refresh.yml
          git add src/components/aact/AdminExtras.tsx .github/workflows/restore-and-add-invoice-refresh.yml
          git commit -m "restore AdminExtras long design and add invoice refresh button"
          git push origin HEAD:program-rules-canonical-editor

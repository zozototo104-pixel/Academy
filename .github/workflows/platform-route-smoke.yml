name: Platform Route Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to crawl"
        required: true
        default: "https://academy-raqaba.vercel.app"
      route_limit:
        description: "Maximum number of UI routes to visit"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: platform-route-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-smoke:
    name: Crawl platform pages for crashes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || secrets.BASE_URL }}
      ROUTE_SMOKE_LIMIT: ${{ inputs.route_limit }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.AACT_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.AACT_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Verify route smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Strict deployed app preflight
        shell: bash
        run: |
          set -euo pipefail
          base="${E2E_BASE_URL%/}"
          out="test-results/platform-routes"
          mkdir -p "$out"

          bypass_headers=()
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            bypass_headers=(
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
              -H "x-vercel-set-bypass-cookie: true"
            )
          fi

          curl_json() {
            local name="$1"
            local method="$2"
            local url="$3"
            local data_file="${4:-}"
            local body="$out/${name}.body"
            local headers="$out/${name}.headers"
            local status
            if [ -n "$data_file" ]; then
              status=$(curl -sS -L -X "$method" -D "$headers" -o "$body" -w '%{http_code}' \
                "${bypass_headers[@]}" \
                -H 'content-type: application/json' \
                --data-binary "@$data_file" \
                "$url" || echo '000')
            else
              status=$(curl -sS -L -X "$method" -D "$headers" -o "$body" -w '%{http_code}' \
                "${bypass_headers[@]}" \
                "$url" || echo '000')
            fi
            local content_type
            content_type=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)
            printf 'status=%s\ncontent_type=%s\nurl=%s\n' "$status" "${content_type:-unknown}" "$url" > "$out/${name}.meta"
            echo "$status"
          }

          body_preview() {
            local file="$1"
            python - "$file" <<'PY'
import sys
try:
    print(open(sys.argv[1], 'rb').read(4000).decode('utf-8', 'replace'))
except Exception as exc:
    print(f'<unable to read body: {exc}>')
PY
          }

          json_field() {
            local file="$1"
            local expr="$2"
            python - "$file" "$expr" <<'PY'
import json, sys
path, expr = sys.argv[1], sys.argv[2]
try:
    data = json.load(open(path, encoding='utf-8'))
    cur = data
    for part in expr.split('.'):
        cur = cur.get(part) if isinstance(cur, dict) else None
    if isinstance(cur, bool):
        print('true' if cur else 'false')
    elif cur is None:
        print('')
    else:
        print(cur)
except Exception:
    print('')
PY
          }

          fail_check() {
            local name="$1"
            local reason="$2"
            echo "::error title=${name} failed::${reason}"
            echo "----- ${name} headers -----"
            cat "$out/${name}.headers" || true
            echo "----- ${name} body preview -----"
            body_preview "$out/${name}.body" || true
            exit 1
          }

          echo "Checking deployed app before crawling: $base"
          echo "Workflow commit: ${GITHUB_SHA}"

          # Health is the authoritative deep readiness check and exposes the deployed commit.
          health_status=$(curl_json health GET "$base/api/health")
          health_type=$(awk -F= '/^content_type=/{print $2}' "$out/health.meta")
          health_ok=$(json_field "$out/health.body" ok)
          deployed_commit=$(json_field "$out/health.body" version.commit)
          health_state=$(json_field "$out/health.body" status)
          echo "Health: HTTP $health_status; content-type=$health_type; ok=$health_ok; status=$health_state; deployed_commit=${deployed_commit:-unknown}"

          if ! echo "$health_type" | grep -qi 'application/json'; then
            fail_check health "health must return JSON. HTML 500 means the deployed app is crashing before it can report readiness."
          fi
          if [ -n "${deployed_commit:-}" ] && [ "$deployed_commit" != "local" ] && [ "$deployed_commit" != "$GITHUB_SHA" ]; then
            fail_check health "E2E_BASE_URL is serving commit ${deployed_commit}, but this workflow is testing commit ${GITHUB_SHA}. Wait for Vercel deployment or pass the matching preview URL."
          fi
          if [ "$health_status" != "200" ] || [ "$health_ok" != "true" ]; then
            fail_check health "deep health check is not ready. The JSON body contains the failing dependency."
          fi

          login_payload="$out/admin-login.payload.json"
          python - <<'PY' > "$login_payload"
import json, os
print(json.dumps({"email": os.environ["E2E_ADMIN_EMAIL"], "password": os.environ["E2E_ADMIN_PASSWORD"]}))
PY
          login_status=$(curl_json admin-login POST "$base/api/auth/login" "$login_payload")
          login_type=$(awk -F= '/^content_type=/{print $2}' "$out/admin-login.meta")
          login_role=$(json_field "$out/admin-login.body" user.role)
          login_token=$(json_field "$out/admin-login.body" token)
          echo "Admin login preflight: HTTP $login_status; content-type=$login_type; role=${login_role:-missing}; token=$([ -n "$login_token" ] && echo present || echo missing)"
          if [ "$login_status" != "200" ] || ! echo "$login_type" | grep -qi 'application/json' || [ "$login_role" != "ADMIN" ] || [ -z "$login_token" ]; then
            fail_check admin-login "admin login must return 200 JSON with user.role=ADMIN and token before route crawling."
          fi

      - name: Run platform route smoke crawler
        run: bun run e2e:routes

      - name: Upload compact route smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-route-smoke-diagnostics
          path: |
            test-results/platform-routes/
          if-no-files-found: ignore
          retention-days: 14

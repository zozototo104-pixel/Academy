name: Scan Arabic lam-alef PDF text

on:
  workflow_dispatch:

jobs:
  scan-lam-alef:
    name: Scan lam-alef patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run lam-alef diagnostic scan
        run: bunx tsx scripts/scan-lam-alef.ts

name: Remove temporary restore workflow

on:
  push:
    branches:
      - program-rules-canonical-editor
    paths:
      - .github/workflows/restore-admin-extras.yml

permissions:
  contents: write

jobs:
  remove-self:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: program-rules-canonical-editor
      - name: Delete temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-admin-extras.yml
          git add .github/workflows/restore-admin-extras.yml
          git commit -m "remove temporary AdminExtras restore workflow"
          git push origin HEAD:program-rules-canonical-editor

name: Restore AdminExtras exact long version

on:
  push:
    branches:
      - program-rules-canonical-editor
    paths:
      - .github/workflows/restore-admin-extras.yml

permissions:
  contents: write

jobs:
  restore-admin-extras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          ref: program-rules-canonical-editor
          fetch-depth: 0

      - name: Restore AdminExtras.tsx from clean commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout e6fa54372aac059e3ada0e4bb6beda85d9eb6c1a -- src/components/aact/AdminExtras.tsx
          rm -f .github/workflows/restore-admin-extras.yml
          git add src/components/aact/AdminExtras.tsx .github/workflows/restore-admin-extras.yml
          git commit -m "restore AdminExtras exact long version"
          git push origin HEAD:program-rules-canonical-editor

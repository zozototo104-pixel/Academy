name: Setup Clean Database

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose the database operation. Prefer QA cleanup after workflow tests; full cleanup deletes real users.'
        required: true
        default: 'qa-cleanup-dry-run'
        type: choice
        options:
          - qa-cleanup-dry-run
          - qa-cleanup-execute
          - cleanup-dry-run
          - cleanup-execute
          - factory-dry-run
          - factory-execute
          - setup-clean-database
      confirm:
        description: 'QA execute: DELETE_QA_ONLY. Setup: SETUP. Full cleanup: DELETE_ALL_NON_ADMINS_AND_REAL_DATA. Factory: DELETE_CONTENT_TOO.'
        required: true
        default: 'NO'

concurrency:
  group: setup-clean-database
  cancel-in-progress: false

jobs:
  database:
    name: Run selected database operation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      AACT_AUTO_SEED_ON_LOGIN: '0'
      AACT_ENABLE_DEMO_LOGIN: '0'
      AACT_RUN_SEED: 'NO'
      AACT_BOOTSTRAP_DEFAULT_ADMIN: '0'
      AACT_CONFIRM_DATA_LOSS: 'NO'
      AACT_CREATE_ADMIN: 'YES'
      AACT_ALLOW_DESTRUCTIVE_DB_WORKFLOW: ${{ secrets.AACT_ALLOW_DESTRUCTIVE_DB_WORKFLOW }}
      AACT_ADMIN_EMAIL: ${{ secrets.AACT_ADMIN_EMAIL }}
      AACT_ADMIN_PASSWORD: ${{ secrets.AACT_ADMIN_PASSWORD }}
      AACT_ADMIN_NAME: ${{ secrets.AACT_ADMIN_NAME }}
      SELECTED_OPERATION: ${{ github.event.inputs.operation }}
      OPERATION_CONFIRMATION: ${{ github.event.inputs.confirm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Verify required database secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DATABASE_URL; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$SELECTED_OPERATION" = "setup-clean-database" ]; then
            for key in DIRECT_URL NEXTAUTH_SECRET AACT_ADMIN_EMAIL AACT_ADMIN_PASSWORD AACT_ADMIN_NAME; do
              if [ -z "${!key}" ]; then
                echo "Missing required setup secret: $key"
                missing=1
              fi
            done
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run selected database operation
        shell: bash
        run: |
          set -euo pipefail

          echo "Selected operation: $SELECTED_OPERATION"

          case "$SELECTED_OPERATION" in
            qa-cleanup-dry-run)
              echo "Running QA-only cleanup dry-run. No real user data will be deleted."
              bun run data:cleanup:qa:dry-run
              ;;

            qa-cleanup-execute)
              if [ "$OPERATION_CONFIRMATION" != "DELETE_QA_ONLY" ]; then
                echo "Refusing QA cleanup. Type DELETE_QA_ONLY in the confirm field."
                exit 1
              fi
              echo "Running QA-only cleanup. Only workflow/test fixtures will be removed."
              AACT_CONFIRM_QA_ONLY_CLEANUP=DELETE_QA_ONLY bun run data:cleanup:qa
              ;;

            cleanup-dry-run)
              echo "Running full launch cleanup dry-run. No data will be deleted, but execute mode deletes every non-admin user."
              bun run data:cleanup:dry-run
              ;;

            cleanup-execute)
              if [ "$OPERATION_CONFIRMATION" != "DELETE_ALL_NON_ADMINS_AND_REAL_DATA" ]; then
                echo "Refusing full cleanup. This deletes real non-admin users. Type DELETE_ALL_NON_ADMINS_AND_REAL_DATA in the confirm field."
                exit 1
              fi
              echo "Running full launch cleanup. Admin users will be preserved; all non-admin users and operational data will be deleted."
              AACT_CONFIRM_DATA_CLEANUP=KEEP_ADMINS_CLEAN_DATABASE AACT_CONFIRM_FULL_RESET=DELETE_ALL_NON_ADMINS_AND_REAL_DATA bun run data:cleanup
              ;;

            factory-dry-run)
              echo "Running factory cleanup dry-run. No data will be deleted."
              bun run data:cleanup:factory:dry-run
              ;;

            factory-execute)
              if [ "$OPERATION_CONFIRMATION" != "DELETE_CONTENT_TOO" ]; then
                echo "Refusing factory cleanup. Type DELETE_CONTENT_TOO in the confirm field."
                exit 1
              fi
              echo "Running factory cleanup. Admin users will be preserved, but real users and academic content will be deleted."
              AACT_CONFIRM_DATA_CLEANUP=KEEP_ADMINS_CLEAN_DATABASE AACT_CONFIRM_FULL_RESET=DELETE_ALL_NON_ADMINS_AND_REAL_DATA AACT_CONFIRM_FACTORY_RESET=DELETE_CONTENT_TOO bun run data:cleanup:factory
              ;;

            setup-clean-database)
              if [ "$OPERATION_CONFIRMATION" != "SETUP" ]; then
                echo "Refusing setup. Type SETUP in the confirm field."
                exit 1
              fi
              echo "Preparing clean database schema and core catalog/settings, then creating/updating admin."
              bun run db:push
              bun run db:seed:core
              bun run admin:create
              ;;

            *)
              echo "Unknown operation: $SELECTED_OPERATION"
              exit 1
              ;;
          esac

      - name: Summary
        run: |
          echo "Database operation completed: $SELECTED_OPERATION"
          echo "Check the operation log above for dry-run counters or deletion results."

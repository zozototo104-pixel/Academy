name: Admin Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: true
        default: "https://academy-raqaba.vercel.app"

permissions:
  contents: read

concurrency:
  group: admin-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    name: Admin dashboard Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.AACT_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.AACT_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Verify required E2E secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run admin smoke test
        run: bun run e2e:admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

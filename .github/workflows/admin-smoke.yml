name: Admin Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: true
        default: "https://academy-raqaba.vercel.app"

permissions:
  contents: read

concurrency:
  group: admin-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    name: Admin dashboard Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || secrets.BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.AACT_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.AACT_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Verify required E2E secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Wait for deployed PDF and W3C routes
        shell: bash
        run: |
          set -euo pipefail
          base="${E2E_BASE_URL%/}"

          curl_check() {
            local url="$1"
            local body="$2"
            local headers="$3"
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              curl -sS -D "$headers" -o "$body" \
                -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                -H "x-vercel-set-bypass-cookie: true" \
                "$url" || true
            else
              curl -sS -D "$headers" -o "$body" "$url" || true
            fi
          }

          echo "Waiting for deployed PDF route: $base/api/pdf/transcript"
          for i in {1..60}; do
            curl_check "$base/api/pdf/transcript" /tmp/pdf-route-check.txt /tmp/pdf-route-headers.txt
            code=$(awk 'NR==1 {print $2}' /tmp/pdf-route-headers.txt | tail -1)
            echo "PDF attempt $i: HTTP ${code:-000}"
            if [ "${code:-000}" != "404" ] && [ "${code:-000}" != "000" ]; then
              echo "PDF transcript route is deployed."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "PDF transcript route was not deployed after waiting. Last response:"
              cat /tmp/pdf-route-check.txt || true
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for deployed W3C route: $base/api/verify/certificates/__route_probe__"
          for i in {1..60}; do
            curl_check "$base/api/verify/certificates/__route_probe__" /tmp/w3c-route-check.txt /tmp/w3c-route-headers.txt
            code=$(awk 'NR==1 {print $2}' /tmp/w3c-route-headers.txt | tail -1)
            content_type=$(grep -i '^content-type:' /tmp/w3c-route-headers.txt | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)
            echo "W3C attempt $i: HTTP ${code:-000}; content-type=${content_type:-unknown}"
            if echo "$content_type" | grep -qi 'application/json\|application/ld+json'; then
              echo "W3C certificate route is deployed."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "W3C certificate route was not deployed after waiting. Last response:"
              cat /tmp/w3c-route-check.txt || true
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for deployed frontend admin route: $base/admin"
          for i in {1..60}; do
            curl_check "$base/admin" /tmp/admin-route-check.txt /tmp/admin-route-headers.txt
            code=$(awk 'NR==1 {print $2}' /tmp/admin-route-headers.txt | tail -1)
            echo "Admin route attempt $i: HTTP ${code:-000}"
            if [ "${code:-000}" != "404" ] && [ "${code:-000}" != "000" ]; then
              echo "Frontend admin route is deployed."
              exit 0
            fi
            sleep 10
          done
          echo "Frontend admin route was not deployed after waiting. Last response:"
          cat /tmp/admin-route-check.txt || true
          exit 1

      - name: Run admin smoke test
        run: bun run e2e:admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

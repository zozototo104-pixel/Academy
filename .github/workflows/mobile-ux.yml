name: Mobile UX Guardrails Suite

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: true
        default: "https://academy-raqaba.vercel.app"

permissions:
  contents: read

jobs:
  mobile-ux:
    name: Mobile UX checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      - name: Verify required mobile UX secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run mobile UX guardrails suite
        run: bun run e2e:mobile

      - name: Upload mobile UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-report
          path: |
            test-results/mobile-ux/**
            playwright-report/**
          if-no-files-found: warn
